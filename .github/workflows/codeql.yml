name: CodeQL

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@3ea37a44b6e4e6847c46edae209410d258d548d1
        with:
          languages: python
      - uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279

