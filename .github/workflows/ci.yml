name: Python quality
on:
  workflow_call:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: python-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install CPU inference dependencies
        run: python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - name: Install package and tools
        run: python -m pip install '.[dev,browser]' 'setuptools>=83' pip-audit
      - run: python -m pip check
      - run: black --check .
      - run: isort --check-only .
      - run: flake8 .
      - run: mypy
      - run: pytest -q
      - name: Real YOLO-World positive and blank-image controls
        if: matrix.python == '3.12'
        env:
          YOLO_AUTOINSTALL: 'false'
          YOLO_CONFIG_DIR: ${{ runner.temp }}/sf311ai-model-config
        run: python scripts/model_smoke.py
      - name: Audit registry packages (CLIP commit is reviewed separately)
        run: pip-audit
      - name: Audit upstream versions of the CPU Torch builds
        run: |
          python scripts/torch_audit_requirements.py > "$RUNNER_TEMP/torch-audit.txt"
          cat "$RUNNER_TEMP/torch-audit.txt"
          pip-audit --disable-pip --no-deps -r "$RUNNER_TEMP/torch-audit.txt"
      - name: Build wheel and source distribution
        run: python -m build
      - name: Verify installed distribution
        run: |
          python -m pip install --force-reinstall --no-deps dist/*.whl
          cd /tmp
          python -c 'from sf311ai.ai_detector_yoloworld import YOLOWorldAIDetector; from sf311ai.workflows import process_images_and_report'
